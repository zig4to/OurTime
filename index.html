<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skupni koledar</title>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "lucide-react": "https://esm.sh/lucide-react@0.454.0?external=react"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module">
      // No backend on GitHub Pages, so window.storage is shimmed with
      // localStorage: data stays on this device/browser only, it is not
      // actually shared between people who open the page.
      const STORAGE_PREFIX = "skupni-koledar:";
      window.storage = {
        async get(key) {
          const raw = localStorage.getItem(STORAGE_PREFIX + key);
          return { value: raw === null ? null : raw };
        },
        async set(key, value) {
          localStorage.setItem(STORAGE_PREFIX + key, value);
          return { ok: true };
        },
        async delete(key) {
          localStorage.removeItem(STORAGE_PREFIX + key);
          return { ok: true };
        },
        async list(prefix) {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(STORAGE_PREFIX + prefix)) {
              keys.push(k.slice(STORAGE_PREFIX.length));
            }
          }
          return { keys };
        },
      };

      const source = await (await fetch("./skupni-koledar.jsx")).text();
      const { code } = Babel.transform(source, {
        presets: [["react", { runtime: "automatic" }]],
        filename: "skupni-koledar.jsx",
      });
      const blobUrl = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" })
      );
      const [{ default: App }, { createRoot }, { createElement }] = await Promise.all([
        import(blobUrl),
        import("react-dom/client"),
        import("react"),
      ]);
      createRoot(document.getElementById("root")).render(createElement(App));
    </script>
  </body>
</html>
